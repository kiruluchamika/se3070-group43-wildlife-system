<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061419" />
    <meta name="description" content="WildGuard — Smart Wildlife Conservation and Anti-Poaching Monitoring System" />
    <title>WildGuard · Smart Wildlife Conservation</title>
    <script>
      try {
        if (localStorage.getItem('wildguard-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch {
        /* storage unavailable: keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
